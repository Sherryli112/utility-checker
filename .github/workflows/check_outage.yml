name: 水電查詢日報

on:
  schedule:
    # 每天台灣時間 00:00 執行（UTC 16:00）
    - cron: '0 16 * * *'
  workflow_dispatch:
    # 允許手動觸發，測試時用這個，不必等到凌晨

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run outage check
        env:
          TARGET_ADDRESS:     ${{ vars.TARGET_ADDRESS }}
          RECIPIENT_EMAIL:    ${{ vars.RECIPIENT_EMAIL }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CHECK_DAYS:         ${{ vars.CHECK_DAYS }}
        run: python -u check_outage.py

  # GitHub 會在公開 repo 60 天無活動後自動停用排程；
  # 每次執行時透過 API 重新 enable 本 workflow，重置計時，避免被停用。
  # 獨立成一個 job，查詢失敗也不影響續命。
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable workflow to reset inactivity timer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/check_outage.yml/enable"
